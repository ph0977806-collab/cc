<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nguyenhoangphuc</title>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; font-family: 'Poppins', sans-serif; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow: hidden; }
    
    /* VIDEO NỀN */
    #bg-video {
        position: fixed; top: 50%; left: 50%;
        min-width: 100%; min-height: 100%; width: auto; height: auto;
        transform: translate(-50%, -50%);
        z-index: -2; object-fit: cover; opacity: 0.4;
    }

    /* LỚP NỀN TUYẾT RƠI */
    #snow-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -1; }

    /* MÀN HÌNH CHỜ & HIỆU ỨNG BLUR */
    #splash-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 1.2s ease-in-out, filter 1.2s ease-in-out, visibility 1.2s; }
    .fade-out-blur { opacity: 0; filter: blur(20px); visibility: hidden; }
    .splash-container { text-align: center; cursor: pointer; }
    
    .splash-name { 
        color: #fff; font-family: 'Alex Brush', cursive; font-size: clamp(80px, 20vw, 150px); font-weight: 400; 
        text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #fff, 0 0 40px #8a2be2, 0 0 80px #8a2be2; 
        border-right: 3px solid #fff; animation: blink-caret 0.75s step-end infinite; 
        filter: blur(12px); opacity: 0.3; transform: scale(0.95); 
        transition: filter 2s ease-out, opacity 2s ease-out, transform 2s ease-out; 
    }
    .show-text { filter: blur(0px); opacity: 1; transform: scale(1); }
    @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: #fff } }
    
    .click-text { color: #888; font-size: 16px; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 8px; opacity: 0; margin-top: 20px; transition: opacity 1s ease-in-out, color 0.3s; pointer-events: none; }
    .click-text.show { opacity: 1; pointer-events: auto; }
    .click-text:hover { color: #fff; }
    .dot { width: 6px; height: 6px; background: #fff; border-radius: 50%; box-shadow: 0 0 5px #fff; animation: blink 1s infinite alternate; }
    @keyframes blink { 0% { opacity: 0.2; } 100% { opacity: 1; } }

    /* TRANG PROFILE CHÍNH */
    #main-profile { display: none; opacity: 0; transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out; transform: translateY(20px); width: 100%; justify-content: center; align-items: center; z-index: 10; position: relative; }
    #main-profile.show { opacity: 1; transform: translateY(0); }
    
    .glass-card { 
        background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); 
        border-radius: 24px; padding: 25px; width: 100%; max-width: 480px; 
        backdrop-filter: blur(15px); position: relative; 
        animation: glowBorder 3s infinite alternate;
    }

    @keyframes glowBorder {
        0% { box-shadow: 0 0 10px rgba(168, 85, 247, 0.2); border-color: rgba(255, 255, 255, 0.3); }
        100% { box-shadow: 0 0 30px rgba(168, 85, 247, 0.8); border-color: rgba(168, 85, 247, 0.6); }
    }
    
    /* NÚT LOA */
    .volume-btn { position: absolute; top: -50px; left: 0; width: 45px; height: 45px; background: rgba(255, 255, 255, 0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; z-index: 10; transition: 0.3s; }
    .volume-btn:hover { background: rgba(255, 255, 255, 0.4); }

    .profile-header { display: flex; gap: 20px; align-items: center; margin-bottom: 15px; }
    
    /* AVATAR (ĐÃ BỎ VIỀN TÍM VÀ BÓNG ĐEN) */
    .avatar-container { 
        position: relative; 
        width: 110px; 
        height: 110px; 
        flex-shrink: 0; 
    }

    .avatar { 
        width: 100%; 
        height: 100%; 
        border-radius: 50%; 
        object-fit: cover; 
        border: none; 
        box-shadow: none; 
        background: transparent; 
        display: block;
    }
    
    .status-icon { 
        position: absolute; 
        bottom: -2px; 
        right: -2px; 
        width: 30px; 
        height: 30px; 
        background: #80848e; 
        border-radius: 50%; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        border: 3px solid #333; 
        z-index: 2; 
    }
    .status-icon i { font-size: 14px; color: white; }
    
    .info { flex: 1; }
    .name { font-size: 24px; font-weight: 600; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-bottom: 5px; }
    .badge-img { height: 24px; vertical-align: middle; }
    .discord-tag { font-size: 16px; color: #ddd; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: bold; }
    
    /* HIỆU ỨNG CHỮ BIO PHÁT SÁNG */
    .bio { 
        font-size: 15px; color: #fff; margin-bottom: 15px; font-weight: bold; 
        text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #a855f7, 0 0 40px #a855f7; 
        animation: pulseBio 2s infinite alternate; 
    }

    @keyframes pulseBio {
        from { opacity: 0.8; text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #a855f7, 0 0 40px #a855f7; }
        to { opacity: 1; text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 40px #a855f7, 0 0 60px #a855f7; }
    }
    
    /* ICON MẠNG XÃ HỘI NẢY LÊN */
    .socials { display: flex; gap: 15px; font-size: 24px; align-items: center; }
    .socials a, .socials i { color: #fff; cursor: pointer; transition: 0.3s; text-decoration: none; display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; }
    .socials a:hover, .socials i:hover { 
        color: #a855f7; transform: translateY(-8px) scale(1.2); 
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }
    
    .divider { width: 100%; height: 1px; background: rgba(255,255,255,0.2); margin: 20px 0; }
    
    /* NHỊP TIM MÈO */
    .bottom-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #fff; font-weight: bold; flex-wrap: wrap; gap: 10px; }
    .custom-icons { display: flex; gap: 10px; align-items: center; }
    .custom-icons img { 
        height: 30px; width: 30px; object-fit: cover; border-radius: 6px; 
        animation: heartbeat 1.5s infinite; 
    }

    @keyframes heartbeat {
        0% { transform: scale(1); }
        14% { transform: scale(1.1); }
        28% { transform: scale(1); }
        42% { transform: scale(1.1); }
        70% { transform: scale(1); }
    }
    
    .stats { display: flex; gap: 10px; align-items: center; font-size: 14px; }
    .stats i { margin-right: 4px; }
    .dot-sep { color: #aaa; font-size: 16px; margin: 0 5px; }
    
    body.show-profile { background: #000; transition: background 1.5s ease-in-out; }
</style>
</head>
<body>

    <!-- VIDEO NỀN ĐỘNG -->
    <video autoplay loop muted playsinline id="bg-video">
        <source src="https://cdn.mp4tourl.com/video/free/5e867645-d064-4433-84fb-0a398359dfc8.mp4" type="video/mp4">
    </video>

    <!-- LỚP VẼ TUYẾT -->
    <canvas id="snow-canvas"></canvas>

    <!-- NHẠC NỀN -->
    <audio id="bg-music" loop>
        <source src="https://www.image2url.com/r2/default/files/1793628883493-84930b1d-649a-4852-8038-dd396e77ee46.mp3" type="audio/mpeg">
    </audio>

    <div id="splash-screen" onclick="enterProfile()">
        <div class="splash-container">
            <h1 class="splash-name" id="typewriter-text"></h1>
            <div class="click-text" id="click-to-enter">
                <div class="dot"></div><span>Click to enter</span>
            </div>
        </div>
    </div>

    <div id="main-profile">
        <div class="glass-card">
            <div class="volume-btn" id="vol-btn" onclick="toggleMusic()">
                <i class="fas fa-volume-mute" id="vol-icon"></i>
            </div>
            
            <div class="profile-header">
                <div class="avatar-container">
                    <!-- AVATAR MÈO (KHÔNG VIỀN) -->
                    <img src="https://i.postimg.cc/bvptdzv0/IMG-0054.gif" alt="Avatar" class="avatar" id="discord-avatar">
                    <div class="status-icon" id="discord-status"><i class="fas fa-minus"></i></div>
                </div>
                <div class="info">
                    <div class="name" id="discord-name">
                        Đang tải...
                        <!-- 5 BADGE CỦA MÀY -->
                        <img src="https://cdn.discordapp.com/attachments/1343182309842747496/1568979153280180384/legend.png?ex=6af1c934&is=6af077b4&hm=afebed858dec4146a9d8db5f0182f2b6b7a8a8e297363ceecac831d258472f38&" class="badge-img" alt="Badge 1">
                        <img src="https://cdn.discordapp.com/attachments/1343182309842747496/1568979347786698762/platinum.png?ex=6af1c962&is=6af077e2&hm=c598d7081cc4b61ae6e33d71637402e65c2dc49abe837741af0e2bc1ddad8889&" class="badge-img" alt="Badge 2">
                        <img src="https://cdn.discordapp.com/attachments/1343182309842747496/1568979435401519304/partnered.png?ex=6af1c977&is=6af077f7&hm=453c33a5e2d78feb5c87bd65fd4e116309ec0c11489af8be90dea1df47b236bd&" class="badge-img" alt="Badge 3">
                        <img src="https://cdn.discordapp.com/attachments/1343182309842747496/1568979461175509113/verified.png?ex=6af1c97d&is=6af077fd&hm=e303613d6e00c4efe92e95a3166ae57226fca6383b8835f776e3fdf702cbff3d&" class="badge-img" alt="Badge 4">
                        <img src="https://cdn.discordapp.com/attachments/1343182309842747496/1568979534529695907/verified-bot.png?ex=6af1c98f&is=6af0780f&hm=af9464b5e30a634a18d1a2ef3cbf7e18db04b87f8d56175e5ded0b1a1ee00d27&" class="badge-img" alt="Badge 5">
                    </div>
                    
                    <div class="discord-tag"><i class="fab fa-discord"></i> <span id="discord-username">...</span></div>
                    
                    <div class="bio" id="discord-bio"></div>
                    
                    <div class="socials">
                        <a href="https://discord.com/users/1310594946784559271" target="_blank">
                            <i class="fab fa-discord"></i>
                        </a>
                        <i class="fab fa-telegram"></i>
                        <i class="fab fa-instagram"></i>
                        <i class="fab fa-tiktok"></i>
                    </div>
                </div>
            </div>
            
            <div class="divider"></div>
            
            <div class="bottom-row">
                <div class="custom-icons">
                    <img src="https://static2.klipy.com/ii/4493325008d34b7bf8cd6813cd5c1619/51/4b/4wxAcPKvSI7J1Lzz.gif" alt="Cat">
                    <img src="https://static2.klipy.com/ii/4493325008d34b7bf8cd6813cd5c1619/51/4b/4wxAcPKvSI7J1Lzz.gif" alt="Cat">
                    <img src="https://static2.klipy.com/ii/4493325008d34b7bf8cd6813cd5c1619/51/4b/4wxAcPKvSI7J1Lzz.gif" alt="Cat">
                </div>
                <div class="stats">
                    <span><i class="fas fa-eye"></i> 11,082,427</span>
                    <span class="dot-sep">|</span>
                    <span><i class="fas fa-map-marker-alt"></i> Vietnam, Phu Tho</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. NHẠC NỀN
        const bgMusic = document.getElementById('bg-music');
        const volIcon = document.getElementById('vol-icon');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                volIcon.className = 'fas fa-volume-mute';
            } else {
                bgMusic.play();
                volIcon.className = 'fas fa-volume-up';
            }
            isPlaying = !isPlaying;
        }

        // 2. HIỆU ỨNG GÕ CHỮ MÀN HÌNH CHỜ
        const textToType = "nguyenhoangphuc"; 
        const typewriterElement = document.getElementById("typewriter-text");
        const clickTextElement = document.getElementById("click-to-enter");
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < textToType.length) {
                typewriterElement.innerHTML += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 100); 
            } else {
                typewriterElement.style.borderRight = "none";
                typewriterElement.classList.add('show-text');
                setTimeout(() => { clickTextElement.classList.add('show'); }, 2000);
            }
        }
        setTimeout(typeWriter, 500);

        // 3. CHUYỂN TRANG & TỰ ĐỘNG PHÁT NHẠC & GÕ CHỮ BIO
        function enterProfile() {
            document.getElementById('splash-screen').classList.add('fade-out-blur');
            document.getElementById('main-profile').style.display = 'flex';
            
            bgMusic.volume = 0.5; 
            bgMusic.play().then(() => {
                isPlaying = true;
                volIcon.className = 'fas fa-volume-up';
            }).catch(e => console.log("Trình duyệt chặn autoplay, hãy bấm nút loa."));

            setTimeout(() => {
                document.body.classList.add('show-profile');
                document.getElementById('main-profile').classList.add('show');
                setTimeout(typeBio, 500);
            }, 300);
        }

        // HÀM GÕ CHỮ CHO BIO
        const bioText = "Do y"; 
        let bioIndex = 0;
        const bioElement = document.getElementById("discord-bio");

        function typeBio() {
            if (bioIndex < bioText.length) {
                bioElement.innerHTML += bioText.charAt(bioIndex);
                bioIndex++;
                setTimeout(typeBio, 100); 
            }
        }

        // 4. HIỆU ỨNG TUYẾT RƠI
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let particles = [];

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Snowflake {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 2 + 1;
                this.speedY = Math.random() * 1 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.3;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y > height) {
                    this.y = -10;
                    this.x = Math.random() * width;
                }
                if (this.x > width) this.x = 0;
                if (this.x < 0) this.x = width;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 150; i++) {
            particles.push(new Snowflake());
        }

        function animateSnow() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateSnow);
        }
        animateSnow();

        // 5. API DISCORD (LẤY TÊN, STATUS)
        const DISCORD_ID = '1310594946784559271'; 
        async function fetchDiscordData() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const result = await response.json();
                if (result.success) {
                    const data = result.data;
                    
                    document.getElementById('discord-name').childNodes[0].nodeValue = data.discord_user.global_name || data.discord_user.username;
                    document.getElementById('discord-username').innerText = data.discord_user.username;
                    
                    const statusIcon = document.getElementById('discord-status');
                    const status = data.discord_status;
                    if (status === 'online') { statusIcon.style.backgroundColor = '#23a55a'; statusIcon.innerHTML = ''; }
                    else if (status === 'idle') { statusIcon.style.backgroundColor = '#f0b232'; statusIcon.innerHTML = ''; }
                    else if (status === 'dnd') { statusIcon.style.backgroundColor = '#f23f43'; statusIcon.innerHTML = '<i class="fas fa-minus"></i>'; }
                    else { statusIcon.style.backgroundColor = '#80848e'; statusIcon.innerHTML = ''; }
                }
            } catch (error) { console.log("Chưa lấy được API Lanyard."); }
        }
        fetchDiscordData();
        setInterval(fetchDiscordData, 15000);
    </script>
</body>
</html>
